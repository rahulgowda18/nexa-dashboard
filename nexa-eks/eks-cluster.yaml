apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: nexa-eks
  region: ap-south-1
  version: "1.34"

iam:
  withOIDC: true

addonsConfig:
  autoApplyPodIdentityAssociations: true

addons:
  - name: eks-pod-identity-agent

  - name: aws-ebs-csi-driver
    useDefaultPodIdentityAssociations: true

  - name: metrics-server

managedNodeGroups:
  - name: nexa-ng
    instanceType: t3.small
    minSize: 2
    maxSize: 2
    desiredCapacity: 2
    volumeSize: 20
    privateNetworking: false